<div
  class="page-animate min-h-screen bg-slate-50 py-10 px-4 sm:px-6 lg:px-8"
  dir="ltr"
>
  <div class="max-w-7xl mx-auto space-y-8">
    <!-- Header Section -->
    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs"
    >
      <div>
        <h1 class="text-2xl font-black text-slate-900 flex items-center gap-2">
          <mat-icon class="text-slate-800 w-8 h-8 text-[32px]"
            >admin_panel_settings</mat-icon
          >
          Inventory & Custom Properties
        </h1>
        <p class="text-xs text-slate-500 font-medium mt-1">
          Dynamically configure specific properties for Perfumes, Balloons,
          Gifts, and Hot Deals.
        </p>
      </div>

      <button
        (click)="openAddModal()"
        class="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-5 py-3 rounded-2xl transition-all shadow-md cursor-pointer shrink-0"
      >
        <mat-icon class="!w-4 !h-4 !text-[18px]">add</mat-icon>
        <span>Add Product</span>
      </button>
    </div>
    <!-- End Section -->

    <!-- Category Tabs & Search Bar -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
      <app-category-filter
        (specCategory)="categoryProducts($event)"
      ></app-category-filter>

      <div class="relative w-full md:w-72">
        <!-- <app-search-product
          [categories]="categories"
          [activeCategory]="activeCategoryFilter()"
          [searchQuery]="searchQuery()"
          [categoryCounts]="categoryCounts()"
        ></app-search-product> -->
      </div>
    </div>

    <!-- Products Table -->
    <div
      class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden"
    >
      <div
        class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden"
      >
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-700">
            <thead
              class="bg-slate-50 border-b border-slate-200/80 text-slate-500 font-bold uppercase tracking-wider text-[11px]"
            >
              <tr>
                <th scope="col" class="py-4 px-6">Product</th>
                <th scope="col" class="py-4 px-6">Category</th>
                <th scope="col" class="py-4 px-6">Price</th>
                <th scope="col" class="py-4 px-6">active</th>
                <th scope="col" class="py-4 px-6 text-center">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              @for (product of products(); track product._id) {
                <tr
                  class="hover:bg-slate-50/60 transition-colors"
                  app-table-admin
                  [product]="product"
                  (editModel)="openEditModal(product)"
                  (Product)="editProduct($event)"
                ></tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  @if (isModalOpen()) {
    <app-modal
      (close)="closeModal($event)"
      [productData]="selectedProduct()"
    ></app-modal>
  }
</div>
